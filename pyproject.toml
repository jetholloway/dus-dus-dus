[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "dus-dus-dus"
version = "0.1.0"
description = "Python bindings and web UI for the dus-dus-dus game engine"
requires-python = ">=3.12"

# Dependencies live in environment.yml, which micromamba installs.

[tool.maturin]
manifest-path = "bindings/Cargo.toml"
module-name = "dus_engine"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so the tests can import the server package
