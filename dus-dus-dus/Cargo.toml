# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
engine = { path = "../engine" }
burn = { version = "0.13.2", features = ["train", "wgpu"] }
text_io = "0.1.12"
bots = { path = "../bots" }
serde_json = "1.0"
